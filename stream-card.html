<title>Pink Girly Stream Card</title>
<style>
  :root{
    --bg-1: #2a1420;
    --panel: #1f1420;
    --pink: #ff6fae;
    --pink-deep: #d9418f;
    --pink-pale: #ffd6ea;
    --black: #201118;
    --text: #fff5fa;
    --muted: #cfa3bc;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: radial-gradient(circle at 25% 15%, #55223d, #1a0c14 70%);
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
  }

  .card{
    width: 300px;
    border-radius: 24px;
    overflow: hidden;
    background: var(--panel);
    box-shadow: 0 20px 45px rgba(0,0,0,.5);
    border: 2px solid var(--pink);
  }

  .placeholder-note{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color: rgba(255,255,255,.55);
    font-size: 11px;
    text-align:center;
    padding: 0 20px;
  }

  .bow{
    position:absolute;
    font-size: 26px;
  }
  .bow--tl{ top:10px; left:12px; }
  .bow--tr{ top:10px; right:14px; }

  .badge-live{
    position:absolute;
    top:8px;
    left:50%;
    transform: translateX(-50%);
    display:flex;
    align-items:center;
    gap:6px;
    background: var(--pink-deep);
    color:#fff;
    font-size:12px;
    font-weight:700;
    padding:5px 12px;
    border-radius:999px;
    letter-spacing:.3px;
    box-shadow: 0 4px 10px rgba(217,65,143,.5);
  }

  .badge-live::before{
    content:"";
    width:7px; height:7px;
    border-radius:50%;
    background:#fff;
  }

  .badge-viewers{
    position:absolute;
    bottom:12px;
    right:12px;
    display:flex;
    align-items:center;
    gap:5px;
    background: rgba(32,17,24,.6);
    backdrop-filter: blur(4px);
    color:#fff;
    font-size:12px;
    font-weight:600;
    padding:5px 10px;
    border-radius:999px;
  }

  .badge-viewers::before{
    content:"";
    width:6px; height:6px;
    border-radius:50%;
    background: var(--pink-pale);
  }

  .card__body{
    padding: 16px 16px 18px;
    background: linear-gradient(180deg, var(--panel), var(--black));
  }

  .card__title{
    margin:0 0 12px;
    font-size:17px;
    line-height:1.35;
    font-weight:800;
    color: var(--pink-pale);
  }

  .card__streamer{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    flex-shrink:0;
    background: linear-gradient(135deg, var(--pink), var(--pink-deep));
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-weight:800;
    font-size:16px;
    border: 2px solid var(--pink-pale);
  }

  .streamer-meta{
    display:flex;
    flex-direction:column;
    gap:2px;
    overflow:hidden;
  }

  .streamer-name{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:14px;
    font-weight:700;
    color: var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .verified{
    width:14px; height:14px;
    flex-shrink:0;
  }

  .streamer-cat{
    font-size:12.5px;
    color: var(--muted);
  }
</style>
